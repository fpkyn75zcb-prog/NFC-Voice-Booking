<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>NFC Voice Booking</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="card">
      <div class="badge">NFC VOICE BOOKING</div>
      <h1>Book an appointment</h1>
      <p class="intro">Tap the microphone and tell us what you need.</p>

      <button id="talk" class="talk" type="button" aria-label="Start voice booking">🎙</button>
      <p id="status" class="status">Ready</p>

      <div id="conversation" class="conversation" aria-live="polite"></div>

      <form id="bookingForm" class="booking-form">
        <label>Name<input id="name" required autocomplete="name" placeholder="Your name"></label>
        <label>Phone<input id="phone" required autocomplete="tel" placeholder="Phone number"></label>
        <label>Date<input id="date" required type="date"></label>
        <label>Time<input id="time" required type="time"></label>
        <button class="book" type="submit">Confirm appointment</button>
      </form>

      <div id="confirmation" class="confirmation" hidden></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
